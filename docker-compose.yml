name: aktivitaeten-in-muenster

services:
  # One-shot init container: downloads the OSM extract only if it is missing.
  # Runs as the host user (override LOCAL_UID/LOCAL_GID if yours is not 1000) so the
  # file lands in backend/data with the same ownership as the rest of the repo.
  geodata:
    image: curlimages/curl:8.11.1
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        target=/backend/data/muenster-regbez.osm.pbf
        if [ -s "$$target" ]; then
          echo "Geodata already present at $$target - skipping download."
          exit 0
        fi
        mkdir -p "$$(dirname "$$target")"
        echo "Downloading geodata to $$target ..."
        curl -L --fail --output "$$target.part" https://download.geofabrik.de/europe/germany/nordrhein-westfalen/muenster-regbez-latest.osm.pbf
        mv "$$target.part" "$$target"
        echo "Geodata download complete."
    volumes:
      # Mount the parent dir so backend/data can be created with the host user's ownership.
      - ./backend:/backend
    networks:
      - app
    restart: "no"

  frontend:
    # Built and pushed by .github/workflows/docker-publish.yml on every push to main.
    # `docker compose pull` fetches it; `build:` stays so `--build` still works locally.
    image: ghcr.io/timogriese/aktivitaeten_in_muenster-frontend:latest
    build:
      context: ./frontend
    environment:
      # Used by the Nuxt/Nitro routeRules proxy for server-side /api/** calls.
      BACKEND_URL: http://backend:8080
    expose:
      - "3000"
    networks:
      - app
    restart: unless-stopped

  backend:
    # Built and pushed by .github/workflows/docker-publish.yml on every push to main.
    # `docker compose pull` fetches it; `build:` stays so `--build` still works locally.
    image: ghcr.io/timogriese/aktivitaeten_in_muenster-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_PATH: /data/activities.db
      ROUTING_OSM_FILE: /data/osm/muenster-regbez.osm.pbf
      ROUTING_GRAPH_DIRECTORY: /data/graph
    volumes:
      # Shared SQLite database at the repo root.
      - ./activities.db:/data/activities.db
      # OSM extract (backend/data/muenster-regbez.osm.pbf), see backend/README.md.
      - ./backend/data:/data/osm:ro
      # GraphHopper graph cache, imported once and reused.
      - routing-graph:/data/graph
    expose:
      - "8080"
    networks:
      - app
    restart: unless-stopped
    depends_on:
      geodata:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 8080, not 80 (your VPS-nginx / Nginx Proxy Manager owns that). Bound to all
      # interfaces (not 127.0.0.1) so NPM's own container - a separate network
      # namespace - can actually reach it via the VPS's IP.
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  routing-graph:
